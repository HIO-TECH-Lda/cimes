# Ambiente de desenvolvimento (G.12): SQL Server 2022 Developer + Mailpit.
# As senhas são exclusivas do ambiente local e sintéticas (R-01, R-12).
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cimes-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CimesDev2027!x"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - cimes-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mail:
    image: axllent/mailpit:latest
    container_name: cimes-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  cimes-db-data: